<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <style>
      .terminal-bg { fill: #0d1117; stroke: #30363d; stroke-width: 2; rx: 10; }
      .header-bar { fill: #161b22; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      .title-text { fill: #8b949e; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; font-weight: bold; }
      .code-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; }
      .c-blue { fill: #58a6ff; font-weight: bold; }
      .c-green { fill: #3fb950; font-weight: bold; }
      .c-yellow { fill: #d29922; font-weight: bold; }
      .c-red { fill: #f85149; font-weight: bold; }
      .c-white { fill: #c9d1d9; }
      .c-gray { fill: #8b949e; }
      .c-cyan { fill: #39c5bb; font-weight: bold; }
      
      /* Animation Sequence */
      @keyframes stepAnimation {
        0%, 15%   { opacity: 1; transform: translateY(0px); }
        20%, 35%  { opacity: 1; transform: translateY(0px); }
        40%, 60%  { opacity: 1; transform: translateY(0px); }
        65%, 85%  { opacity: 1; transform: translateY(0px); }
        90%, 100% { opacity: 1; transform: translateY(0px); }
      }
      
      .cursor {
        animation: blink 0.8s infinite;
      }
      @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    </style>
  </defs>

  <!-- Terminal Window Frame -->
  <rect width="850" height="480" class="terminal-bg" />
  <path d="M0,0 H850 V36 H0 Z" class="header-bar" />
  
  <!-- Window Controls -->
  <circle cx="20" cy="18" r="6" class="dot-red" />
  <circle cx="40" cy="18" r="6" class="dot-yellow" />
  <circle cx="60" cy="18" r="6" class="dot-green" />
  <text x="425" y="23" text-anchor="middle" class="title-text">stm32-bxcan-telemetry-node — 500 kbps @ 36MHz APB1</text>

  <!-- Static Initial Banner -->
  <g transform="translate(25, 65)">
    <text y="0" class="code-text c-blue">+-----------------------------------------------------------------------------------+</text>
    <text y="20" class="code-text c-white">|   <tspan class="c-cyan">STM32F103 bxCAN 2.0B Telemetry &amp; Safety Node</tspan> — Engineering Prototype            |</text>
    <text y="40" class="code-text c-white">|   Author: <tspan class="c-green">S. Sherifred Singh</tspan> | Clock: <tspan class="c-yellow">36 MHz APB1</tspan> | Target: <tspan class="c-yellow">500 kbps Automotive Bus</tspan> |</text>
    <text y="60" class="code-text c-blue">+-----------------------------------------------------------------------------------+</text>
    
    <text y="90" class="code-text c-green">[INIT]</text>
    <text x="50" y="90" class="code-text c-white">Mode: <tspan class="c-yellow">LOOPBACK</tspan> (Internal Silicon Self-Test) | Prescaler: <tspan class="c-yellow">4</tspan> | Sample Point: <tspan class="c-green">83.3%</tspan></text>
    
    <text y="112" class="code-text c-green">[FILTER]</text>
    <text x="65" y="112" class="code-text c-white">32-bit Bank 0 Configured: ID=<tspan class="c-cyan">0x120</tspan>, MASK=<tspan class="c-cyan">0x7FF</tspan> -&gt; Routed to <tspan class="c-yellow">FIFO 0</tspan></text>

    <!-- Animated Telemetry Steps -->
    <!-- Test Case 1: Normal Telemetry -->
    <g transform="translate(0, 140)">
      <text y="0" class="code-text c-yellow">&gt;&gt;&gt; TEST 1: Normal Periodic Telemetry Transmission (100ms Cycle)</text>
      <text y="22" class="code-text c-gray">  [TX Node 1]</text>
      <text x="100" y="22" class="code-text c-white">[ID: <tspan class="c-cyan">0x120</tspan> | DLC: 8 | Data: CC B0 09 92 24 30 01 01]</text>
      <text y="44" class="code-text c-green">  [DECODED]</text>
      <text x="90" y="44" class="code-text c-white">Pack: <tspan class="c-green">52.4V</tspan> | Motor: <tspan class="c-cyan">2450 RPM</tspan> | Temp: <tspan class="c-green">36°C</tspan> | Speed: <tspan class="c-cyan">48 km/h</tspan> | Seq: <tspan class="c-yellow">1</tspan></text>
    </g>

    <!-- Test Case 2: Hardware Filter Rejection -->
    <g transform="translate(0, 215)">
      <text y="0" class="code-text c-yellow">&gt;&gt;&gt; TEST 2: Hardware Acceptance Filter Validation (Foreign ID: 0x345)</text>
      <text y="22" class="code-text c-gray">  [INJECT]</text>
      <text x="80" y="22" class="code-text c-white">[ID: <tspan class="c-red">0x345</tspan> | DLC: 4 | Data: DE AD BE EF]</text>
      <text y="44" class="code-text c-green">  [PASS]</text>
      <text x="65" y="44" class="code-text c-white">Silicon Filter Bank 0 Rejected ID 0x345: <tspan class="c-green">Zero CPU Interrupt Overhead!</tspan></text>
    </g>

    <!-- Test Case 3: Thermal Alarm -->
    <g transform="translate(0, 290)">
      <text y="0" class="code-text c-yellow">&gt;&gt;&gt; TEST 3: Thermal Safety Threshold Triggering (Cell Temp: 64°C &gt; 60°C)</text>
      <text y="22" class="code-text c-red">  [CRITICAL ALARM]</text>
      <text x="145" y="22" class="code-text c-red">&gt;&gt;&gt; BATTERY OVER-TEMP DETECTED (64°C &gt; 60°C Safe Limit)! &lt;&lt;&lt;</text>
      <text y="44" class="code-text c-cyan">  [ACTION]</text>
      <text x="85" y="44" class="code-text c-white">Active Cooling Pump Enabled | Motor Inverter Derated to 30%</text>
    </g>

    <!-- Test Case 4: Timeout -->
    <g transform="translate(0, 365)">
      <text y="0" class="code-text c-yellow">&gt;&gt;&gt; TEST 4: Communication Timeout Detection (Heartbeat Loss &gt; 300ms)</text>
      <text y="22" class="code-text c-red">  [FAULT]</text>
      <text x="75" y="22" class="code-text c-white">No CAN heartbeat for 350ms (Threshold: 300ms) -&gt; <tspan class="c-red">CAN_COMMS_LOSS_DTC Raised</tspan></text>
      <text y="40" class="code-text c-green">[SUCCESS] All 4 Automotive CAN 2.0B Verification Scenarios Passed.<tspan class="cursor c-white">_</tspan></text>
    </g>
  </g>
</svg>
