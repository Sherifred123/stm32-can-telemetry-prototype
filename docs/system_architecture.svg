<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b0f19; }
      .box-mcu { fill: #111827; stroke: #3b82f6; stroke-width: 2; rx: 12; }
      .box-app { fill: #1e293b; stroke: #10b981; stroke-width: 1.5; rx: 8; }
      .box-can { fill: #172554; stroke: #60a5fa; stroke-width: 1.5; rx: 8; }
      .box-filter { fill: #312e81; stroke: #818cf8; stroke-width: 1.5; rx: 8; }
      .box-safety { fill: #450a0a; stroke: #ef4444; stroke-width: 1.5; rx: 8; }
      .box-ext { fill: #1f2937; stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 4,4; rx: 8; }
      
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: bold; fill: #f8fafc; }
      .sub-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #94a3b8; }
      .text-reg { font-family: 'Consolas', monospace; font-size: 11px; fill: #cbd5e1; }
      .text-bold { font-family: 'Consolas', monospace; font-size: 11px; font-weight: bold; fill: #38bdf8; }
      .text-green { font-family: 'Consolas', monospace; font-size: 11px; font-weight: bold; fill: #4ade80; }
      .text-red { font-family: 'Consolas', monospace; font-size: 11px; font-weight: bold; fill: #f87171; }
      .text-yellow { font-family: 'Consolas', monospace; font-size: 11px; font-weight: bold; fill: #fbbf24; }
      
      .arrow { stroke: #38bdf8; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-green { stroke: #4ade80; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
      .arrow-red { stroke: #f87171; stroke-width: 2; stroke-dasharray: 3,3; fill: none; marker-end: url(#arrowhead-red); }
      .arrow-loop { stroke: #f59e0b; stroke-width: 2.5; stroke-dasharray: 5,4; fill: none; marker-end: url(#arrowhead-loop); }
    </style>
    
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8" />
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4ade80" />
    </marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f87171" />
    </marker>
    <marker id="arrowhead-loop" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="480" class="bg" />

  <!-- Main MCU Boundary -->
  <rect x="20" y="20" width="860" height="440" class="box-mcu" />
  <text x="40" y="48" class="title">STM32F103C8T6 (ARM Cortex-M3 @ 72 MHz)</text>
  <text x="640" y="48" class="sub-title">APB1 Peripheral Bus: 36 MHz</text>

  <!-- ===================================================================== -->
  <!-- Layer 1: Application & Telemetry Engine                              -->
  <!-- ===================================================================== -->
  <!-- Block: Sensor Telemetry Generator -->
  <rect x="50" y="80" width="230" height="150" class="box-app" />
  <text x="65" y="105" class="title" style="font-size: 14px; fill: #10b981;">1. EV Telemetry Engine</text>
  <text x="65" y="130" class="text-reg">Pack Voltage: <tspan class="text-bold">52.4 V (1 mV / bit)</tspan></text>
  <text x="65" y="150" class="text-reg">Motor Speed:  <tspan class="text-bold">2450 RPM</tspan></text>
  <text x="65" y="170" class="text-reg">Pack Temp:    <tspan class="text-bold">36°C (-40..+125)</tspan></text>
  <text x="65" y="190" class="text-reg">Vehicle Speed:<tspan class="text-bold">48 km/h</tspan></text>
  <text x="65" y="210" class="text-yellow">telemetry_pack() -&gt; 8 Bytes</text>

  <!-- Block: Safety Supervisor & Alarms -->
  <rect x="50" y="270" width="230" height="160" class="box-safety" />
  <text x="65" y="295" class="title" style="font-size: 14px; fill: #f87171;">4. Safety &amp; Fault Supervisor</text>
  <text x="65" y="320" class="text-reg">Over-Temp Limit: <tspan class="text-red">&gt; 60°C Cutoff</tspan></text>
  <text x="65" y="340" class="text-reg">Under-Volt Limit: <tspan class="text-yellow">&lt; 42.0V Cutoff</tspan></text>
  <text x="65" y="360" class="text-reg">Heartbeat Timeout: <tspan class="text-yellow">&gt; 300 ms</tspan></text>
  <text x="65" y="385" class="text-green">Action: Active Cooling Enable</text>
  <text x="65" y="405" class="text-red">Action: Safe State Failover</text>

  <!-- ===================================================================== -->
  <!-- Layer 2: STM32 bxCAN Silicon Peripheral                               -->
  <!-- ===================================================================== -->
  <rect x="330" y="80" width="520" height="350" class="box-can" />
  <text x="350" y="105" class="title" style="font-size: 15px; fill: #60a5fa;">2. bxCAN Peripheral (500 kbps Automotive Setup)</text>
  <text x="350" y="125" class="text-reg">Clock: 36 MHz | Prescaler (BRP): 4 | TS1: 14 Tq | TS2: 3 Tq | Sample Point: <tspan class="text-green">83.3%</tspan></text>

  <!-- TX Mailbox 0 -->
  <rect x="350" y="145" width="210" height="65" fill="#1e3a8a" stroke="#3b82f6" rx="6" />
  <text x="365" y="170" class="title" style="font-size: 13px; fill: #bfdbfe;">TX Mailbox 0 (Transmitter)</text>
  <text x="365" y="192" class="text-bold">CAN_TI0R: ID=0x120 | DLC=8</text>

  <!-- 32-bit Filter Bank 0 -->
  <rect x="610" y="145" width="220" height="120" class="box-filter" />
  <text x="625" y="170" class="title" style="font-size: 13px; fill: #c7d2fe;">32-bit Filter Bank 0</text>
  <text x="625" y="195" class="text-reg">Filter ID:   <tspan class="text-green">0x120</tspan></text>
  <text x="625" y="215" class="text-reg">Filter Mask: <tspan class="text-yellow">0x7FF (Exact)</tspan></text>
  <text x="625" y="235" class="text-bold" style="fill: #a5b4fc;">(ID &amp; MASK) == (0x120 &amp; 0x7FF)</text>
  <text x="625" y="253" class="text-green">Match -&gt; Routed to FIFO 0</text>

  <!-- RX FIFO 0 -->
  <rect x="610" y="295" width="220" height="90" fill="#064e3b" stroke="#10b981" rx="6" />
  <text x="625" y="320" class="title" style="font-size: 13px; fill: #a7f3d0;">RX FIFO 0 (Receiver)</text>
  <text x="625" y="345" class="text-reg">Depth: 16-Frame Ring Buffer</text>
  <text x="625" y="365" class="text-green">Interrupt-Driven Extraction</text>

  <!-- ===================================================================== -->
  <!-- Arrows & Flow Connections                                             -->
  <!-- ===================================================================== -->
  <!-- Telemetry to TX Mailbox -->
  <path d="M 280 155 L 342 165" class="arrow" />

  <!-- Internal Silicon Loopback Arrow -->
  <path d="M 455 210 C 455 260, 560 260, 602 215" class="arrow-loop" />
  <text x="470" y="270" class="text-yellow" style="font-size: 11px;">Internal Silicon Loopback Route</text>

  <!-- Filter Bank to RX FIFO 0 -->
  <path d="M 720 265 L 720 287" class="arrow-green" />

  <!-- Noise ID 0x345 Rejection Arrow -->
  <path d="M 680 145 C 680 120, 780 110, 780 135" class="arrow-red" />
  <text x="700" y="130" class="text-red">0x345: Rejected</text>

  <!-- RX FIFO to Unpacker & Safety Supervisor -->
  <path d="M 610 340 L 290 350" class="arrow-green" />
  <text x="380" y="365" class="text-green">telemetry_unpack() -&gt; Safety Evaluation</text>
</svg>
